name: Tägliches Briefing
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - name: Briefing erstellen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: gemini-3-flash-preview,gemini-2.5-flash
        run: python fetch.py
      - name: Ergebnis speichern
        run: |
          if [ ! -f docs/data.json ]; then
            echo "Keine neue data.json erzeugt. Vorhandene Daten bleiben unverändert."
            exit 0
          fi

          git config user.name "briefing-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen an docs/data.json."
          else
            git commit -m "Briefing aktualisiert"
            git push
          fi
