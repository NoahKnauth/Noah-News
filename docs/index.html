<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tägliches Briefing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%) fixed;min-height:100vh;color:#222}
header{max-width:42rem;margin:0 auto;padding:calc(env(safe-area-inset-top) + 1rem) 1rem .6rem;color:#fff}
h1{font-size:1.4rem;line-height:1.2}
.ts{font-size:.85rem;opacity:.9;margin-top:.2rem}
nav{position:sticky;top:0;z-index:5;background:rgba(70,50,130,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top)}
#tabs{max-width:42rem;margin:0 auto;display:flex;gap:.5rem;overflow-x:auto;padding:.6rem 1rem;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;font:600 .95rem inherit;font-family:inherit;color:#fff;background:rgba(255,255,255,.16);border:0;border-radius:2rem;padding:.55rem 1rem;min-height:2.6rem}
#tabs button[aria-selected=true]{background:#fff;color:#5a3fa0}
main{max-width:42rem;margin:0 auto;padding:.75rem .75rem calc(env(safe-area-inset-bottom) + 2rem)}
article{background:#fff;border-radius:12px;padding:1rem;margin-bottom:.75rem;box-shadow:0 4px 14px rgba(0,0,0,.15)}
h2{font-size:1.05rem;line-height:1.35;color:#1f2340;margin-bottom:.4rem}
article p{color:#333;line-height:1.65}
.q{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.q a{color:#4a3d9c;background:#eeeaff;border-radius:6px;padding:.35rem .6rem;font-size:.85rem;text-decoration:none;min-height:2rem;display:inline-flex;align-items:center}
.f{background:#fff3cd;border-left:4px solid #ffc107;border-radius:8px;padding:1rem;color:#6b5200}
.l{color:#fff;text-align:center;padding:2rem 1rem}
a:focus-visible,button:focus-visible{outline:3px solid #ffd700;outline-offset:2px}
</style>
</head>
<body>
<header><h1>Tägliches Briefing</h1><div class="ts" id="ts"></div></header>
<nav><div id="tabs" role="tablist"></div></nav>
<main id="out"><div class="l">Laden …</div></main>
<script>
const $=id=>document.getElementById(id);
function el(t,txt,c){const e=document.createElement(t);if(txt)e.textContent=txt;if(c)e.className=c;return e}
fetch("data.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  if(d.erstellt)$("ts").textContent="Erstellt: "+new Date(d.erstellt).toLocaleString("de-DE",{dateStyle:"long",timeStyle:"short"});
  const show=i=>{
    [...$("tabs").children].forEach((b,j)=>{b.setAttribute("aria-selected",j===i);if(j===i)b.scrollIntoView({inline:"center",block:"nearest"})});
    const out=$("out");out.replaceChildren();
    const t=d.themen[i];
    if(t.fehler||!t.meldungen||!t.meldungen.length)out.append(el("div",t.fehler||"Keine Meldungen verfügbar.","f"));
    (t.meldungen||[]).forEach(m=>{
      const a=el("article");a.append(el("h2",m.titel),el("p",m.text));
      const s=el("div",null,"q");
      (m.quellen||[]).filter(q=>q.url).forEach(q=>{const l=el("a",q.name||"Quelle");l.href=q.url;l.target="_blank";l.rel="noopener";s.append(l)});
      if(s.children.length)a.append(s);
      out.append(a);
    });
    scrollTo(0,0);
  };
  d.themen.forEach((t,i)=>{const b=el("button",t.name);b.setAttribute("role","tab");b.onclick=()=>show(i);$("tabs").append(b)});
  show(0);
}).catch(()=>{$("out").replaceChildren(el("div","Keine Daten gefunden. Starte den Ablauf in GitHub unter Actions einmal manuell.","f"))});
</script>
</body>
</html>
